[project]
name = "pulse-backend"
version = "0.1.0"
description = "Legislative intelligence backend API with hybrid RAG and DuckDB analytics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.7.5",
    "langchain-voyageai>=0.1.6",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "stripe>=16.0.0",
    "supabase>=2.33.0",
    "upstash-redis>=1.8.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
